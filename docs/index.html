    <style>
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            background: #222;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            /* Center the game canvas both axes. When the canvas is scaled to the
               window height, this produces an even ~1 tile margin top and bottom. */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* The game canvas is rendered at its native pixel resolution and then
           scaled up by CSS. `pixelated` keeps the upscale crisp (nearest
           neighbour) instead of blurry (bilinear). */
        canvas {
            display: block;
            /* The canvas is rendered at full device resolution and displayed
               1:1, so no CSS image scaling happens here. Pixel-art crispness is
               handled in Pixi (nearest-neighbour sampling on the sprite atlas). */
        }
        #source {
            position: fixed;
            bottom: 8px;
            right: 12px;
        }
        #source a {
            text-decoration: none;
            color: #111;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            visibility: hidden;
            text-align: center;
            color: #eee;
        }
        #loading div {
            margin: 6px;
        }
        #loadingError {
            color: #f00;
        }
    </style>
